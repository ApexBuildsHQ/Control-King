name: Auto Process Remote Data

on:
  push:
    paths:
      - 'raw_data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Processing Script
        run: npm run process-codes

      - name: Commit & Push Cleaned Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/remotes/
          git diff-index --quiet HEAD || (git commit -m "chore: auto-consolidate remote json files [skip ci]" && git push)

